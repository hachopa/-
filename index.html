  var list = state.sales.slice().sort(function (a, b) { return b.date.localeCompare(a.date) || b.createdAt - a.createdAt; });

var MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var WEEKDAY_NAMES = ['일','월','화','수','목','금','토'];

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dateKey(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function reservationsOnDate(dateStr) {
  return state.reservations.filter(function (r) { return r.date === dateStr; })
    .sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });
}

var calAnimDir = null; // 'next' | 'prev' | null

function renderCalendarTab() {
  var y = ui.calYear, m = ui.calMonth;
  var firstDow = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var todayKey = todayStr();

  var cells = '';
  var maxShowPerDay = 6;
  for (var i = 0; i < firstDow; i++) cells += '<div class="cal-cell cal-empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var key = dateKey(y, m, d);
    var dayResv = reservationsOnDate(key);
    var isToday = key === todayKey;
    var itemsHtml = dayResv.slice(0, maxShowPerDay).map(function (r) {
      return '<div class="cal-resv-item">' + (r.time || '-') + ' ' + escapeHtml(r.customerName || '-') + '</div>';
    }).join('');
    var moreHtml = dayResv.length > maxShowPerDay ? '<div class="cal-resv-more">+' + (dayResv.length - maxShowPerDay) + '건 더</div>' : '';
    cells += '<div class="cal-cell ' + (isToday ? 'cal-today' : '') + '" data-action="select-day" data-date="' + key + '">' +
      '<span class="cal-daynum">' + d + '</span>' +
      itemsHtml + moreHtml +
    '</div>';
  }

  var html = '' +
  '<section class="tab-content tab-content-wide">' +
    '<div class="cal-nav">' +
      '<button class="btn ghost" data-action="cal-prev-year">&laquo; ' + (y - 1) + '</button>' +
      '<button class="btn ghost" data-action="cal-prev-month">&lsaquo;</button>' +
      '<h2 class="cal-title">' + y + '년 ' + MONTH_NAMES[m] + '</h2>' +
      '<button class="btn ghost" data-action="cal-next-month">&rsaquo;</button>' +
      '<button class="btn ghost" data-action="cal-next-year">' + (y + 1) + ' &raquo;</button>' +
    '</div>' +
    '<div class="cal-body' + (calAnimDir === 'next' ? ' cal-anim-next' : calAnimDir === 'prev' ? ' cal-anim-prev' : '') + '">' +
      '<div class="cal-weekdays">' + WEEKDAY_NAMES.map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
    '</div>' +
  '</section>';
  calAnimDir = null;
  return html;
}

function timeSlotOptions(selected) {
  var opts = ['<option value="">시간 선택</option>'];
  for (var h = 9; h <= 20; h++) {
    var maxMin = h === 20 ? 0 : 59;
    for (var mm = 0; mm <= maxMin; mm += 30) {
      var val = pad2(h) + ':' + pad2(mm);
      opts.push('<option value="' + val + '" ' + (selected === val ? 'selected' : '') + '>' + val + '</option>');
    }
  }
  return opts.join('');
}

function filterCustomerSuggestions(input) {
  var query = input.value.trim();
  var container = document.getElementById('reservation-suggest-list');
  var form = input.form;
  var hidden = form ? form.querySelector('input[name="customerId"]') : null;
  if (hidden) hidden.value = '';
  if (!container) return;
  if (!query) { container.innerHTML = ''; container.style.display = 'none'; return; }
  var matches = state.customers.filter(function (c) { return c.name.indexOf(query) !== -1; }).slice(0, 6);
  if (!matches.length) { container.innerHTML = ''; container.style.display = 'none'; return; }
  container.innerHTML = matches.map(function (c) {
    var isNonmember = c.type === 'nonmember';
    return '<div class="suggest-item" onmousedown="selectCustomerSuggestion(\'' + c.id + '\')">' +
      '<span class="badge ' + (isNonmember ? 'badge-guest' : 'badge-member') + '" style="margin-right:6px;">' + (isNonmember ? '비회원' : '회원') + '</span>' + escapeHtml(c.name) +
      (c.phone ? ' <span class="muted" style="display:inline;">' + escapeHtml(c.phone) + '</span>' : '') +
    '</div>';
  }).join('');
  container.style.display = 'block';
}

function selectCustomerSuggestion(id) {
  var c = state.customers.find(function (x) { return x.id === id; });
  if (!c) return;
  var form = document.getElementById('reservation-form');
  if (!form) return;
  var nameInput = form.querySelector('input[name="customerName"]');
  var hidden = form.querySelector('input[name="customerId"]');
  var phoneInput = form.querySelector('input[name="phone"]');
  if (nameInput) nameInput.value = c.name;
  if (hidden) hidden.value = c.id;
  if (phoneInput && c.phone) phoneInput.value = c.phone;
  var container = document.getElementById('reservation-suggest-list');
  if (container) { container.innerHTML = ''; container.style.display = 'none'; }
}

function copySmsText(id) {
  var r = state.reservations.find(function (x) { return x.id === id; });
  if (!r) return;
  var msg = buildReservationSmsText(r);
  var done = function (ok) {
    var el = document.getElementById('sms-copy-status-' + id);
    if (el) el.textContent = ok ? '복사했어요! 문자 앱에 붙여넣기 하세요.' : '복사에 실패했어요. 아래 문구를 길게 눌러 직접 복사해주세요.';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(function () { done(true); }).catch(function () {
      copySmsTextFallback(id, msg, done);
    });
  } else {
    copySmsTextFallback(id, msg, done);
  }
}

function copySmsTextFallback(id, msg, done) {
  try {
    var ta = document.getElementById('sms-text-' + id);
    if (ta) {
      ta.focus();
      ta.select();
      var ok = document.execCommand('copy');
      done(!!ok);
      return;
    }
  } catch (e) {}
  done(false);
}

function copyText(text, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () {
      copyTextFallback(text, done);
    });
  } else {
    copyTextFallback(text, done);
  }
}

function copyTextFallback(text, done) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(!!ok);
  } catch (e) {
    done(false);
  }
}

function shiftDateStr(dateStr, delta) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
}

function todayDateLabel(dateStr) {
  var todayKey = todayStr();
  var diffDays = Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayKey + 'T00:00:00')) / 86400000);
  var suffix = diffDays === 0 ? ' (오늘)' : diffDays === 1 ? ' (내일)' : diffDays === -1 ? ' (어제)' : '';
  var d = new Date(dateStr + 'T00:00:00');
  return dateStr + ' ' + WEEKDAY_NAMES[d.getDay()] + '요일' + suffix;
}

function handleBulkSubmit(form) {
  var fd = new FormData(form);
  var text = (fd.get('bulkText') || '').toString();
  var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
  if (!lines.length) { ui.bulkError = '등록할 회원 정보를 입력해주세요.'; renderApp(); return; }
  var added = 0;
  lines.forEach(function (line) {
    var parts = line.split(',').map(function (p) { return p.trim(); });
    var rawName = parts[0];
    if (!rawName) return;
    var ex = extractPhone(rawName);
    var name = ex.name || rawName;
    var phone = parts[1] || ex.phone || '';
    state.customers.push({
      id: uid(), name: name, phone: phone, firstVisit: parts[2] || '', type: 'member', createdAt: Date.now()
    });
    added++;
  });
  ui.bulkFormOpen = false;
  ui.bulkError = '';
  persist();
}

function handleChargeSubmit(form) {
  var fd = new FormData(form);
  var customerId = fd.get('customerId');
  if (!customerId) return;
  var isCharge = fd.get('chargeType') !== 'deduct';
  var amount = parseAmountValue(fd.get('amount'));
  var date = fd.get('date');
  var editId = fd.get('chargeLogId') || null;

  var baseBalance = state.chargeLogs.filter(function (l) { return l.id !== editId; })
    .reduce(function (a, l) { return a + (l.type === 'charge' ? Number(l.amount || 0) : -Number(l.amount || 0)); }, 0);
  var projected = baseBalance + (isCharge ? amount : -amount);
  if (!isCharge && projected < 0) {
    ui.chargeError = '잘못 입력했어요. 차감 금액이 보유 잔액(' + won(baseBalance) + ')보다 많아요.';
    renderApp();
    return;
  }

  if (editId) {
    var log = state.chargeLogs.find(function (l) { return l.id === editId; });
    if (log) { log.type = isCharge ? 'charge' : 'deduct'; log.date = date; log.amount = amount; }
    var linkedSale = state.sales.find(function (s) { return s.chargeLogId === editId; });
    if (isCharge) {
      var editedCustomer = state.customers.find(function (x) { return x.id === customerId; });
      if (linkedSale) {
        linkedSale.date = date; linkedSale.amount = amount;
        linkedSale.payment = fd.get('payment') || linkedSale.payment || '기타';
        linkedSale.type = '회원'; linkedSale.isMembership = true; linkedSale.treatment = 'MEMBERSHIP';
      } else {
        state.sales.push({
          id: uid(), date: date, type: '회원', isMembership: true, customerId: customerId, customerName: editedCustomer ? editedCustomer.name : '',
          treatment: 'MEMBERSHIP', amount: amount, payment: fd.get('payment') || '기타', createdAt: Date.now(), chargeLogId: editId
        });
      }
    } else if (linkedSale) {
      state.sales = state.sales.filter(function (s) { return s.id !== linkedSale.id; });
    }
  } else {
    var chargeLogId = uid();
    state.chargeLogs.push({
      id: chargeLogId, customerId: customerId, type: isCharge ? 'charge' : 'deduct',
      date: date, amount: amount, createdAt: Date.now()
    });
    if (isCharge) {
      var c = state.customers.find(function (x) { return x.id === customerId; });
      state.sales.push({
        id: uid(), date: date, type: '회원', isMembership: true, customerId: customerId, customerName: c ? c.name : '',
        treatment: 'MEMBERSHIP', amount: amount, payment: fd.get('payment') || '기타', createdAt: Date.now(), chargeLogId: chargeLogId
      });
    }
  }
  ui.chargeFormOpen = false;
  ui.editingChargeId = null;
  ui.chargeError = '';
  persist();
}

function handleDayDeductSubmit(form) {

  var isMember = !!custCheck && custCheck.type !== 'nonmember';
  var itemsResult = computeNailItemsFromFormData(fd, isMember);
  var amount = itemsResult.labels.length ? itemsResult.total : parseAmountValue(fd.get('amount'));
  var applyCashDiscount = fd.get('applyCashDiscount') === 'on';
  if (!isMember && applyCashDiscount) {
    amount = Math.max(0, amount - 5000);
  }
  var saleId = fd.get('saleId') || null;
  var oldSale = saleId ? state.sales.find(function (s) { return s.id === saleId; }) : null;
  if (isMember) {
    var availableBalance = customerBalance(customerId) + (oldSale ? Number(oldSale.amount || 0) : 0);
    if (amount > availableBalance) {
      ui.dayDeductError = '잘못 입력했어요. 차감 금액이 보유 잔액(' + won(availableBalance) + ')보다 많아요.';
      renderApp();
      return;
    }
  }
  ui.dayDeductError = '';
  var payment = fd.get('payment') || '기타';
  var memoInput = itemsResult.labels.length ? itemsResult.labels.join(', ') : '';

  if (oldSale) {
    var log = oldSale.chargeLogId ? state.chargeLogs.find(function (l) { return l.id === oldSale.chargeLogId; }) : null;
    var finalMemo = memoInput || oldSale.treatment || '사용';
    oldSale.amount = amount; oldSale.payment = payment; oldSale.memo = finalMemo;
    if (log) { log.amount = amount; log.memo = finalMemo; }
  } else {
    var r = state.reservations.find(function (x) { return x.id === ui.dayDeductReservationId; });
    var date = (r && r.date) || todayStr();
    var treatment = (r && r.treatment) || '';
    var memo = memoInput || treatment || '사용';
    var chargeLogId = null;
    if (isMember) {
      chargeLogId = uid();
      state.chargeLogs.push({
        id: chargeLogId, customerId: customerId, type: 'deduct',
        date: date, amount: amount, memo: memo, createdAt: Date.now()
      });
    }
    state.sales.push({
      id: uid(), date: date, type: isMember ? '회원' : '비회원', customerId: customerId, customerName: custCheck ? custCheck.name : (r && r.customerName) || '',
      treatment: treatment || memo, amount: amount, payment: payment, memo: memo, createdAt: Date.now(), chargeLogId: chargeLogId,
      reservationId: r ? r.id : null
    });
  }
  ui.dayDeductReservationId = null;
  ui.editingDayDeductSaleId = null;
  persist();
}

function handleRescheduleSubmit(form) {
  var fd = new FormData(form);
  var id = fd.get('reservationId');
  var r = state.reservations.find(function (x) { return x.id === id; });
  if (r) { r.date = fd.get('date'); r.time = fd.get('time'); }
  ui.rescheduleReservationId = null;
  persist();
}

function onAppSubmit(e) {
  e.preventDefault();
  try {
    if (e.target.id === 'sale-form') handleSaleSubmit(e.target);
    else if (e.target.id === 'customer-form') handleCustomerSubmit(e.target);
    else if (e.target.id === 'bulk-form') handleBulkSubmit(e.target);
    else if (e.target.id === 'reservation-form') handleReservationSubmit(e.target);
    else if (e.target.id === 'charge-form') handleChargeSubmit(e.target);
    else if (e.target.id === 'day-deduct-form') handleDayDeductSubmit(e.target);
    else if (e.target.id === 'reschedule-form') handleRescheduleSubmit(e.target);
    else if (e.target.id === 'customer-reservation-form') handleCustomerReservationSubmit(e.target);
  } catch (err) {
    console.error('submit failed', err);
    alert('저장 중 오류가 발생했습니다: ' + (err && err.message ? err.message : err));
  }
}

function onAppClick(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  if (action === 'switch-tab') {
    var oldIdx = TAB_ORDER.indexOf(ui.tab === 'today' ? 'calendar' : ui.tab);
    var newIdx = TAB_ORDER.indexOf(el.dataset.tab);
    tabAnimDir = (oldIdx !== -1 && newIdx !== -1) ? (newIdx > oldIdx ? 'next' : newIdx < oldIdx ? 'prev' : null) : null;
    ui.tab = el.dataset.tab; lsSet('ns_tab', ui.tab);
    ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null; ui.dayDeductError = '';
    ui.showDeductsForReservationId = null; ui.rescheduleReservationId = null; ui.pendingDelete = null;
    ui.smsPanelReservationId = null;
    renderApp();
  }
  else if (action === 'open-sale-form') { ui.saleFormOpen = true; renderApp(); }
  else if (action === 'close-sale-form') { ui.saleFormOpen = false; renderApp(); }
  else if (action === 'open-customer-form') { ui.customerFormOpen = true; ui.editingCustomerId = null; ui.customerFormError = ''; renderApp(); }
  else if (action === 'close-customer-form') { ui.customerFormOpen = false; ui.editingCustomerId = null; ui.customerFormError = ''; renderApp(); }
  else if (action === 'open-bulk-form') { ui.bulkFormOpen = true; ui.bulkError = ''; renderApp(); }
  else if (action === 'close-bulk-form') { ui.bulkFormOpen = false; ui.bulkError = ''; renderApp(); }
  else if (action === 'view-customer') { ui.detailCustomerId = id; ui.chargeFormOpen = false; ui.editingChargeId = null; ui.chargeError = ''; ui.customerReservationFormOpen = false; ui.customerReservationError = ''; lsSet('ns_detailCustomerId', id); renderApp(); }
  else if (action === 'close-detail') { ui.detailCustomerId = null; ui.pendingDelete = null; ui.chargeFormOpen = false; ui.editingChargeId = null; ui.chargeError = ''; ui.customerReservationFormOpen = false; ui.customerReservationError = ''; lsSet('ns_detailCustomerId', null); renderApp(); }
  else if (action === 'open-customer-reservation-form') { ui.customerReservationFormOpen = true; ui.customerReservationError = ''; renderApp(); }
  else if (action === 'close-customer-reservation-form') { ui.customerReservationFormOpen = false; ui.customerReservationError = ''; renderApp(); }
  else if (action === 'edit-customer') { ui.editingCustomerId = id; ui.customerFormOpen = true; ui.customerFormError = ''; ui.detailCustomerId = null; ui.tab = 'members'; lsSet('ns_tab', ui.tab); lsSet('ns_detailCustomerId', null); renderApp(); }
  else if (action === 'delete-sale') { ui.pendingDelete = { type: 'sale', id: id }; renderApp(); }
  else if (action === 'delete-customer') { ui.pendingDelete = { type: 'customer', id: id }; renderApp(); }
  else if (action === 'confirm-delete-sale') {
    var saleToDelete = state.sales.find(function (s) { return s.id === id; });
    if (saleToDelete && saleToDelete.chargeLogId) {
      state.chargeLogs = state.chargeLogs.filter(function (l) { return l.id !== saleToDelete.chargeLogId; });
    }
    state.sales = state.sales.filter(function (s) { return s.id !== id; });
    ui.pendingDelete = null;
    persist();
  }
  else if (action === 'confirm-delete-customer') { state.customers = state.customers.filter(function (c) { return c.id !== id; }); ui.detailCustomerId = null; ui.pendingDelete = null; lsSet('ns_detailCustomerId', null); persist(); }
  else if (action === 'toggle-customer-delete-mode') { ui.customerDeleteMode = !ui.customerDeleteMode; ui.customerDeleteSelectedIds = []; ui.pendingDelete = null; renderApp(); }
  else if (action === 'toggle-customer-delete-select') {
    var selIdx = ui.customerDeleteSelectedIds.indexOf(id);
    if (selIdx === -1) ui.customerDeleteSelectedIds.push(id); else ui.customerDeleteSelectedIds.splice(selIdx, 1);
    renderApp();
  }
  else if (action === 'bulk-delete-customers') { ui.pendingDelete = { type: 'bulk-customers', id: null }; renderApp(); }
  else if (action === 'confirm-bulk-delete-customers') {
    var idsToDelete = ui.customerDeleteSelectedIds.slice();
    state.customers = state.customers.filter(function (c) { return idsToDelete.indexOf(c.id) === -1; });
    ui.customerDeleteSelectedIds = [];
    ui.customerDeleteMode = false;
    ui.pendingDelete = null;
    persist();
  }
  else if (action === 'cancel-delete') { ui.pendingDelete = null; renderApp(); }
  else if (action === 'cal-prev-month') { calAnimDir = 'prev'; ui.calMonth--; if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; } lsSet('ns_calYear', ui.calYear); lsSet('ns_calMonth', ui.calMonth); renderApp(); }
  else if (action === 'cal-next-month') { calAnimDir = 'next'; ui.calMonth++; if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; } lsSet('ns_calYear', ui.calYear); lsSet('ns_calMonth', ui.calMonth); renderApp(); }
  else if (action === 'cal-prev-year') { calAnimDir = 'prev'; ui.calYear--; lsSet('ns_calYear', ui.calYear); renderApp(); }
  else if (action === 'cal-next-year') { calAnimDir = 'next'; ui.calYear++; lsSet('ns_calYear', ui.calYear); renderApp(); }
  else if (action === 'set-stats-period') { ui.statsPeriod = el.dataset.period; renderApp(); }
  else if (action === 'stats-ref-today') { ui.statsRefDate = todayStr(); renderApp(); }
  else if (action === 'set-stats-view') { ui.statsView = el.dataset.view; ui.filterType = el.dataset.view === 'membership' ? 'membership' : 'all'; renderApp(); }
  else if (action === 'set-history-period') { ui.filterPeriod = el.dataset.period; renderApp(); }
  else if (action === 'set-history-filter') { ui.filterType = el.dataset.filter; renderApp(); }
  else if (action === 'select-day') { ui.calSelectedDate = el.dataset.date; ui.reservationFormOpen = false; ui.editingReservationId = null; ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null; ui.dayDeductError = ''; ui.showDeductsForReservationId = null; ui.rescheduleReservationId = null; ui.smsPanelReservationId = null; ui.pendingDelete = null; lsSet('ns_calSelectedDate', ui.calSelectedDate); renderApp(); }
  else if (action === 'close-day-modal') { ui.calSelectedDate = null; ui.reservationFormOpen = false; ui.editingReservationId = null; ui.pendingDelete = null; ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null; ui.dayDeductError = ''; ui.showDeductsForReservationId = null; ui.rescheduleReservationId = null; ui.smsPanelReservationId = null; lsSet('ns_calSelectedDate', null); renderApp(); }
  else if (action === 'open-reservation-form') { ui.reservationFormOpen = true; ui.editingReservationId = null; renderApp(); }
  else if (action === 'close-reservation-form') { ui.reservationFormOpen = false; ui.editingReservationId = null; renderApp(); }
  else if (action === 'day-modal-prev' || action === 'day-modal-next' || action === 'day-modal-today') {
    var base = ui.calSelectedDate || todayStr();
    ui.calSelectedDate = action === 'day-modal-today' ? todayStr() : shiftDateStr(base, action === 'day-modal-next' ? 1 : -1);
    ui.reservationFormOpen = false; ui.editingReservationId = null; ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null;
    ui.dayDeductError = ''; ui.showDeductsForReservationId = null; ui.rescheduleReservationId = null; ui.smsPanelReservationId = null; ui.pendingDelete = null;
    lsSet('ns_calSelectedDate', ui.calSelectedDate);
    renderApp();
  }
  else if (action === 'edit-reservation') { ui.editingReservationId = id; ui.reservationFormOpen = true; renderApp(); }
  else if (action === 'delete-reservation') { ui.pendingDelete = { type: 'reservation', id: id }; renderApp(); }
  else if (action === 'confirm-delete-reservation') {
    state.sales.forEach(function (s) { if (s.reservationId === id) s.reservationId = null; });
    state.reservations = state.reservations.filter(function (r) { return r.id !== id; });
    ui.pendingDelete = null;
    persist();
  }
  else if (action === 'open-charge-form') { ui.chargeFormOpen = true; ui.chargeFormType = el.dataset.type === 'deduct' ? 'deduct' : 'charge'; ui.editingChargeId = null; ui.chargeError = ''; renderApp(); }
  else if (action === 'close-charge-form') { ui.chargeFormOpen = false; ui.editingChargeId = null; ui.chargeError = ''; renderApp(); }
  else if (action === 'edit-charge') {
    var editLog = state.chargeLogs.find(function (l) { return l.id === id; });
    if (editLog) { ui.chargeFormOpen = true; ui.chargeFormType = editLog.type; ui.editingChargeId = id; ui.chargeError = ''; }
    renderApp();
  }
  else if (action === 'delete-charge') { ui.pendingDelete = { type: 'charge', id: id }; renderApp(); }
  else if (action === 'confirm-delete-charge') {
    var chargeSaleToRemove = state.sales.find(function (s) { return s.chargeLogId === id; });
    if (chargeSaleToRemove) state.sales = state.sales.filter(function (s) { return s.id !== chargeSaleToRemove.id; });
    state.chargeLogs = state.chargeLogs.filter(function (l) { return l.id !== id; });
    ui.pendingDelete = null;
    persist();
  }
  else if (action === 'open-day-deduct') { ui.dayDeductReservationId = id; ui.editingDayDeductSaleId = null; ui.dayDeductError = ''; renderApp(); }
  else if (action === 'close-day-deduct') { ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null; ui.dayDeductError = ''; renderApp(); }
  else if (action === 'toggle-day-deducts') { ui.showDeductsForReservationId = ui.showDeductsForReservationId === id ? null : id; ui.editingDayDeductSaleId = null; ui.dayDeductError = ''; renderApp(); }
  else if (action === 'open-reschedule') { ui.rescheduleReservationId = id; renderApp(); }
  else if (action === 'close-reschedule') { ui.rescheduleReservationId = null; renderApp(); }
  else if (action === 'toggle-sms-panel') { ui.smsPanelReservationId = ui.smsPanelReservationId === id ? null : id; renderApp(); }
  else if (action === 'copy-sms-text') { copySmsText(id); }
  else if (action === 'copy-sms-phone') { copySmsPhone(id); }
  else if (action === 'edit-day-deduct') {
    var deductSale = state.sales.find(function (s) { return s.id === id; });
    if (deductSale) { ui.dayDeductReservationId = deductSale.reservationId; ui.editingDayDeductSaleId = deductSale.id; ui.dayDeductError = ''; }
    renderApp();
  }
  else if (action === 'delete-day-deduct') { ui.pendingDelete = { type: 'daydeduct', id: id }; renderApp(); }
  else if (action === 'confirm-delete-day-deduct') {
    var saleToUndo = state.sales.find(function (s) { return s.id === id; });
    if (saleToUndo) {
      if (saleToUndo.chargeLogId) {
        state.chargeLogs = state.chargeLogs.filter(function (l) { return l.id !== saleToUndo.chargeLogId; });
      }
      state.sales = state.sales.filter(function (s) { return s.id !== id; });
    }
    ui.pendingDelete = null;
    persist();
  }
}

function buildDocument() {
  var headHTML = HEAD_HTML;
  var scriptText = document.getElementById('app-script').textContent;
  var dataJSON = JSON.stringify(state);
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n' + headHTML + '\n</head>\n<body>\n' +
    '<div id="app"></div>\n' +
    '<script id="app-data" type="application/json">' + dataJSON + '<' + '/script>\n' +
    '<script id="app-script">' + scriptText + '<' + '/script>\n' +
    '</body>\n</html>';
}

function ensureSaveBanner() {
  if (saveBannerEl) return saveBannerEl;
  var el = document.createElement('div');
  el.id = 'save-banner';
  document.body.appendChild(el);
  saveBannerEl = el;
  return el;
}

function updateSaveBanner() {
  var el = ensureSaveBanner();
  if (saveState === 'error') {
    el.style.display = 'block';
    el.className = 'save-banner save-banner-error';
    el.textContent = '저장 실패 - 재시도 중입니다. 화면을 닫지 마세요';
  } else {
    el.style.display = 'none';
    el.textContent = '';
  }
}

function saveStandaloneLocal() {
  try {
    localStorage.setItem(STANDALONE_KEY, JSON.stringify(state));
    localStorage.setItem(STANDALONE_BUILD_KEY, BUILD_ID);
    saveState = 'idle';
  } catch (e) {
    console.error('local save failed', e);
    saveState = 'error';
  }
  updateSaveBanner();
}

function doPublish() {
  if (STANDALONE) { saveStandaloneLocal(); return; }
  if (!artifactApi) { saveState = 'pending'; updateSaveBanner(); return; }
  saveState = 'saving'; updateSaveBanner();
  try {
    artifactApi.publish(buildDocument()).then(function () {
      saveState = 'idle'; updateSaveBanner();
    }).catch(function (e) {
      console.error('save failed', e);
      saveState = 'error'; updateSaveBanner();
      scheduleSaveRetry();
    });
  } catch (e) {
    console.error('save failed', e);
    saveState = 'error'; updateSaveBanner();
    scheduleSaveRetry();
  }
}

function scheduleSaveRetry() {
  if (saveRetryTimer) return;
  saveRetryTimer = setTimeout(function () {
    saveRetryTimer = null;
    doPublish();
  }, 2000);
}

function persist() {
  renderApp();
  doPublish();
}

var touchStartX = null;
var touchStartY = null;
var touchStartInNav = false;
var touchStartOnControl = false;

function onAppTouchStart(e) {
  if (ui.detailCustomerId) return;
  if (!e.touches || !e.touches.length) return;
  touchStartInNav = !!(e.target && e.target.closest && e.target.closest('.cal-nav'));
  touchStartOnControl = !!(e.target && e.target.closest && e.target.closest('button, input, select, textarea, a, label'));
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function onAppTouchEnd(e) {
  if (touchStartX === null || !e.changedTouches || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  var wasInNav = touchStartInNav;
  var wasOnControl = touchStartOnControl;
  touchStartX = null; touchStartY = null; touchStartInNav = false; touchStartOnControl = false;
  if (wasOnControl) return;
  var absDx = Math.abs(dx), absDy = Math.abs(dy);

  if (absDx >= 60 && absDx > absDy * 1.5) {
    if (ui.calSelectedDate) {
      ui.calSelectedDate = shiftDateStr(ui.calSelectedDate, dx < 0 ? 1 : -1);
      ui.reservationFormOpen = false; ui.editingReservationId = null; ui.dayDeductReservationId = null; ui.editingDayDeductSaleId = null;
      ui.dayDeductError = ''; ui.showDeductsForReservationId = null; ui.rescheduleReservationId = null; ui.smsPanelReservationId = null; ui.pendingDelete = null;
      lsSet('ns_calSelectedDate', ui.calSelectedDate);
      renderApp();
    } else if (ui.tab === 'calendar' && !wasInNav) {
      calAnimDir = dx < 0 ? 'next' : 'prev';
      if (dx < 0) { ui.calMonth++; if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; } }
      else { ui.calMonth--; if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; } }
      lsSet('ns_calYear', ui.calYear); lsSet('ns_calMonth', ui.calMonth);
      renderApp();
    }
  }
}

function onAppKeydown(e) {
  if (e.key !== 'Enter') return;
  var el = e.target;
  if (!el || !el.form) return;
  var tag = el.tagName;
  if (tag === 'TEXTAREA') return;
  if (tag === 'INPUT' && (el.type === 'submit' || el.type === 'button')) return;
  e.preventDefault();
}

function init() {
  window.addEventListener('error', function (e) {
    try { alert('오류가 발생했습니다: ' + (e && e.message ? e.message : e)); } catch (_e) {}
  });
  document.getElementById('app').addEventListener('click', function (e) {
    try { onAppClick(e); } catch (err) {
      console.error('click failed', err);
      alert('처리 중 오류가 발생했습니다: ' + (err && err.message ? err.message : err));
    }
  });
  document.getElementById('app').addEventListener('submit', onAppSubmit);
  document.getElementById('app').addEventListener('keydown', onAppKeydown);
  document.getElementById('app').addEventListener('touchstart', onAppTouchStart, { passive: true });
  document.getElementById('app').addEventListener('touchend', onAppTouchEnd, { passive: true });
  var migrated = migrateCustomerPhones();
  renderApp();
  window.addEventListener('beforeunload', function (e) {
    if (saveState === 'pending' || saveState === 'saving' || saveState === 'error') {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) {
      artifactApi = a;
      if (migrated || saveState === 'pending' || saveState === 'error') doPublish();
    });
  }
}
init();
</script>
</body>
</html>
